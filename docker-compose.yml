services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: webapp
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webapp"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      PORT: "3000"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/webapp"
      # Allow the UI when accessed via laptop hostname/IP from other devices on the LAN.
      # For local-only development this is simplest.
      CORS_ORIGIN: "true"
    ports:
      - "0.0.0.0:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ./frontend
    ports:
      - "0.0.0.0:4200:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
